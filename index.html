<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="0; url=fips-dashboard-static.html">
<title>FIPs Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --fil-blue: #0090FF; --fil-navy: #091B2A; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Archivo', system-ui, sans-serif; color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(800px 320px at 80% 0%, rgba(0,144,255,.4), transparent 60%), var(--fil-navy);
  }
  .box { max-width: 520px; text-align: center; }
  h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 10px; }
  p { color: #B9CDE0; margin-bottom: 24px; }
  .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a { color: #fff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); }
  a.primary { background: var(--fil-blue); border-color: var(--fil-blue); }
  a:hover { border-color: var(--fil-blue); }
</style>
</head>
<body>
  <div class="box">
    <h1>Filecoin Improvement Proposals</h1>
    <p>Taking you to the dashboard…</p>
    <div class="links">
      <a class="primary" href="fips-dashboard-static.html">Dashboard</a>
      <a href="fips-timeline-tracker.html">Timeline</a>
    </div>
  </div>
</body>
</html>
