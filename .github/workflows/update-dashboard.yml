name: Update Governance Hub

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - master
    paths-ignore:
      - '*.html'
      - 'fip/**'
      - 'frc/**'
      - 'fips-index.json'
      - 'feed.xml'
      - 'calendar.ics'
      - 'data.json'
      - 'og/**'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install link-preview image support
        # Optional: Pillow draws og/*.png. If this step fails the site still builds without images.
        continue-on-error: true
        run: |
          pip install pillow
          curl -sSfL -o "$RUNNER_TEMP/Archivo.ttf" "https://github.com/google/fonts/raw/main/ofl/archivo/Archivo%5Bwdth%2Cwght%5D.ttf"
          echo "ARCHIVO_FONT=$RUNNER_TEMP/Archivo.ttf" >> "$GITHUB_ENV"

      - name: Generate Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIPS_REPO_DIR: ${{ runner.temp }}/fips-src
          CORE_DEVS_REPO_DIR: ${{ runner.temp }}/core-devs-src
          # Implementers' calls: a Notion internal integration token with the
          # Meetings database shared to it. Without it, data/implementers-calls.csv is used.
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MEETINGS_DB: ${{ vars.NOTION_MEETINGS_DB }}
        run: |
          # Scripts are stdlib-only; they clone filecoin-project/FIPs and core-devs themselves.
          python3 generate_fips_dashboard.py
          python3 fips_timeline_tracker.py
          python3 generate_hub.py

      - name: Check the site before publishing
        # Stops a broken build (missing pages, broken links, bad feeds) from going live.
        run: python3 check_site.py
      
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html overview.html fips-dashboard-static.html fips-timeline-tracker.html core-devs.html implementers.html fip-lifecycle.html network-upgrades.html frcs.html
          # Per-FIP pages (-A also stages pages removed for FIPs no longer listed), search index and feeds
          git add -A fip frc
          git add fips-index.json feed.xml calendar.ics data.json
          # Unlisted editor checklist (reached by typing "editor" in the search box)
          git add editors.html
          if [ -d og ]; then git add -A og; fi
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update dashboard $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
